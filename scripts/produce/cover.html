<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:900px;height:1200px;overflow:hidden}
.c{position:relative;width:900px;height:1200px;background:var(--paper);color:var(--ink);font-family:'Be Vietnam Pro',sans-serif;overflow:hidden}
.art{position:absolute;left:0;top:0;width:900px;height:1200px}
.ja{position:absolute;right:92px;top:120px;writing-mode:vertical-rl;font-family:var(--jfont),serif;font-weight:var(--jweight);font-size:var(--jsize);letter-spacing:.12em;line-height:1.25;color:var(--ink)}
.jsub{position:absolute;right:calc(92px + var(--jsize) * 1.45);top:128px;writing-mode:vertical-rl;font-family:var(--jfont),serif;font-weight:400;font-size:30px;letter-spacing:.2em;color:var(--ink);opacity:.75}
.brand{position:absolute;left:72px;top:72px;font-size:22px;font-weight:700;letter-spacing:.18em;color:var(--ink);opacity:.8}
.brand b{color:#E03E2D}
.bottom{position:absolute;left:72px;right:72px;bottom:72px}
.lv{display:inline-block;border:2.5px solid var(--ink);border-radius:8px;padding:4px 14px;font-weight:700;font-size:24px;letter-spacing:.06em}
.ser{display:inline-block;margin-left:14px;font-size:22px;font-weight:500;opacity:.8}
.t{margin-top:22px;font-size:44px;font-weight:700;line-height:1.22;max-width:560px}
.rule{height:3px;width:64px;background:#E03E2D;margin-top:26px}
</style></head><body><div class="c" id="c"></div>
<script>
const P=new URLSearchParams(location.search);const d=JSON.parse(P.get('d'));
// Font tiêu đề theo thể loại (docs/content-standard.md mục 7). Mặc định Shippori Mincho B1.
const FONTS={'Shippori Mincho B1':'600;800','Zen Old Mincho':'600;900','BIZ UDPMincho':'400;700','Zen Antique':'400','Yuji Syuku':'400','Dela Gothic One':'400','Reggae One':'400','Zen Maru Gothic':'500;900','Kaisei Decol':'500;700','Yusei Magic':'400','Klee One':'400;600','M PLUS Rounded 1c':'500;800','Zen Kaku Gothic New':'500;900','Shippori Antique':'400'};
const font=d.font||'Shippori Mincho B1';const wts=FONTS[font]||'400';
const lk=document.createElement('link');lk.rel='stylesheet';lk.href='https://fonts.googleapis.com/css2?family='+font.replace(/ /g,'+')+':wght@'+wts+'&display=block';document.head.appendChild(lk);
const jweight=wts.split(';').pop();
const pal={N5:['#F3EEE4','#16324F','#B9D0E3'],N4:['#EEF2EC','#163A35','#A9C9B8'],N3:['#123A6F','#F4EFE6','#2C5A93'],N2:['#1D2A44','#F2E9DA','#3A4C70'],N1:['#141414','#EFE6D6','#33302C']}[d.level];
const c=document.getElementById('c');c.style.setProperty('--jfont',`'${font}'`);c.style.setProperty('--jweight',jweight);c.style.setProperty('--paper',pal[0]);c.style.setProperty('--ink',pal[1]);
const len=[...d.ja].length;c.style.setProperty('--jsize',(len<=4?132:len<=7?104:84)+'px');
const A=pal[2],R='#E03E2D',W=900,H=1200;
const motifs={
 sun:`<circle cx="300" cy="520" r="150" fill="${R}"/><g stroke="${A}" stroke-width="10" stroke-linecap="round">${[0,1,2,3,4,5].map(i=>`<line x1="80" x2="${560-i*40}" y1="${720+i*38}" y2="${720+i*38}"/>`).join('')}</g>`,
 wave:`<g fill="none" stroke="${A}" stroke-width="9">${Array.from({length:5},(_,r)=>Array.from({length:6},(_,k)=>{const cx=40+k*120+(r%2?60:0),cy=560+r*60;return [70,50,30].map(rr=>`<path d="M${cx-rr} ${cy} A${rr} ${rr} 0 0 1 ${cx+rr} ${cy}"/>`).join('')}).join('')).join('')}</g><circle cx="470" cy="380" r="54" fill="${R}"/>`,
 gate:`<g fill="${R}"><rect x="110" y="380" width="470" height="34" rx="6"/><rect x="140" y="440" width="410" height="22"/><rect x="190" y="414" width="34" height="440"/><rect x="466" y="414" width="34" height="440"/></g><g stroke="${A}" stroke-width="8">${[0,1,2,3].map(i=>`<line x1="60" x2="620" y1="${880+i*34}" y2="${880+i*34}"/>`).join('')}</g>`,
 city:`<g fill="${A}">${[[90,520,110,360],[220,440,90,440],[330,580,120,300],[470,500,100,380]].map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`).join('')}</g><g fill="${pal[0]}">${Array.from({length:40},(_,i)=>{const col=i%8,row=Math.floor(i/8);return `<rect x="${110+col*62}" y="${620+row*52}" width="16" height="22" opacity=".9"/>`}).join('')}</g><circle cx="560" cy="330" r="46" fill="${R}"/>`,
 mountain:`<path d="M40 900 L270 520 L420 760 L520 610 L680 900Z" fill="${A}"/><path d="M270 520 L318 598 L222 598Z" fill="${pal[0]}"/><circle cx="470" cy="420" r="60" fill="${R}"/>`,
 candle:`<g fill="${R}">${[[200,560,300],[300,500,360],[400,600,260]].map(([x,y,h])=>`<rect x="${x}" y="${y}" width="58" height="${h}" rx="6"/><path d="M${x+29} ${y-70} C${x+52} ${y-34} ${x+44} ${y-12} ${x+29} ${y-8} C${x+14} ${y-12} ${x+6} ${y-34} ${x+29} ${y-70}Z"/>`).join('')}</g><g fill="none" stroke="${A}" stroke-width="8">${[0,1,2].map(i=>`<path d="M60 ${880+i*36} q 45 -26 90 0 t 90 0 t 90 0 t 90 0 t 90 0 t 90 0"/>`).join('')}</g>`,
 lantern:`<rect x="300" y="330" width="90" height="40" rx="6" fill="${A}"/><ellipse cx="345" cy="560" rx="170" ry="200" fill="${R}"/><g stroke="${pal[0]}" stroke-width="6" opacity=".55">${[-120,-60,0,60,120].map(dy=>`<line x1="${345-Math.sqrt(1-(dy/200)**2)*170}" x2="${345+Math.sqrt(1-(dy/200)**2)*170}" y1="${560+dy}" y2="${560+dy}"/>`).join('')}</g><rect x="300" y="750" width="90" height="40" rx="6" fill="${A}"/><line x1="345" y1="230" x2="345" y2="330" stroke="${A}" stroke-width="8"/>`,
 flame:`<path d="M330 900 C150 900 120 720 210 600 C230 700 280 700 290 640 C270 540 320 430 420 380 C400 480 470 520 500 600 C520 560 520 520 510 480 C600 580 610 900 330 900Z" fill="${R}"/><path d="M340 900 C260 900 240 800 290 740 C300 790 330 790 340 760 C340 710 370 660 410 640 C400 700 450 740 450 800 C450 860 410 900 340 900Z" fill="${pal[0]}" opacity=".85"/>`,
 field:`<circle cx="470" cy="420" r="70" fill="${R}"/><path d="M40 900 L280 560 L380 700 L460 620 L680 900Z" fill="${A}"/><path d="M240 560 L280 500 L320 560Z" fill="${R}" opacity=".9"/><g stroke="${A}" stroke-width="7" stroke-linecap="round">${Array.from({length:11},(_,i)=>`<line x1="${70+i*55}" y1="1000" x2="${86+i*55}" y2="930"/>`).join('')}</g>`,
 biwa:`<g transform="rotate(-28 340 640)"><ellipse cx="340" cy="720" rx="150" ry="190" fill="${R}"/><rect x="322" y="300" width="36" height="300" rx="10" fill="${R}"/><rect x="300" y="270" width="80" height="44" rx="10" fill="${A}"/><path d="M262 600 q 18 22 0 44" fill="none" stroke="${pal[0]}" stroke-width="7" stroke-linecap="round" opacity=".8"/><path d="M418 600 q -18 22 0 44" fill="none" stroke="${pal[0]}" stroke-width="7" stroke-linecap="round" opacity=".8"/><rect x="290" y="820" width="100" height="22" rx="6" fill="${A}"/><g stroke="${pal[0]}" stroke-width="3" opacity=".7">${[-18,-6,6,18].map(dx=>`<line x1="${340+dx}" y1="300" x2="${340+dx}" y2="830"/>`).join('')}</g></g>${[[120,420,22],[560,360,16],[600,860,26],[110,900,14]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${A}" opacity=".9"/>`).join('')}`,
 lens:`<circle cx="300" cy="560" r="170" fill="none" stroke="${R}" stroke-width="34"/><circle cx="300" cy="560" r="150" fill="${A}" opacity=".45"/><line x1="420" y1="680" x2="590" y2="850" stroke="${R}" stroke-width="54" stroke-linecap="round"/><path d="M215 500 A100 100 0 0 1 300 440" fill="none" stroke="${pal[0]}" stroke-width="14" stroke-linecap="round" opacity=".8"/>`,
 coin:`<circle cx="320" cy="560" r="190" fill="${R}"/><circle cx="320" cy="560" r="160" fill="none" stroke="${pal[0]}" stroke-width="6" opacity=".55"/><rect x="290" y="530" width="60" height="60" fill="${pal[1]==='#F4EFE6'?'#123A6F':pal[0]}"/><g fill="${A}">${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<circle cx="${320+Math.cos(a)*120}" cy="${560+Math.sin(a)*120}" r="9"/>`}).join('')}</g><g stroke="${A}" stroke-width="8">${[0,1,2].map(i=>`<line x1="80" x2="${600-i*90}" y1="${860+i*40}" y2="${860+i*40}"/>`).join('')}</g>`,
 noface:`<ellipse cx="330" cy="560" rx="150" ry="200" fill="${pal[1]}" opacity=".92"/><path d="M180 600 C160 860 200 980 330 1000 C460 980 500 860 480 600 C440 760 220 760 180 600Z" fill="${A}"/><circle cx="560" cy="860" r="40" fill="${R}"/><line x1="560" y1="780" x2="560" y2="820" stroke="${A}" stroke-width="6"/>`,
 rain:`<g stroke="${A}" stroke-width="7" stroke-linecap="round">${Array.from({length:60},(_,i)=>{const x=60+(i*53)%560,y=300+((i*97)%560);return `<line x1="${x}" y1="${y}" x2="${x-18}" y2="${y+60}"/>`}).join('')}</g><rect x="250" y="560" width="150" height="16" rx="8" fill="${R}"/><path d="M325 470 C230 470 210 560 210 560 L440 560 C440 560 420 470 325 470Z" fill="${R}"/>`
};
c.innerHTML=`<svg class="art" viewBox="0 0 ${W} ${H}">${motifs[d.motif]}</svg><div class="brand">MIRAIGO <b>文庫</b></div>${d.jsub?`<div class="jsub">${d.jsub}</div>`:''}<div class="ja">${d.ja}</div><div class="bottom"><span class="lv">${d.level}</span>${d.series?`<span class="ser">${d.series}</span>`:''}${d.title?`<div class="t">${d.title}</div>`:''}<div class="rule"></div></div>`;
</script></body></html>
